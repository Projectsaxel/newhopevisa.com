<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | New Hope Immigration Services</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: #f8fafc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: #0f172a;
  }
  .logo { width: 72px; height: 72px; margin-bottom: 24px; }
  h1 { font-size: clamp(48px, 10vw, 96px); font-weight: 900; color: #469A3D; line-height: 1; }
  h2 { font-size: clamp(18px, 4vw, 28px); font-weight: 700; margin: 12px 0 8px; }
  p { color: #475569; font-size: 16px; max-width: 420px; line-height: 1.6; margin-bottom: 32px; }
  .langs { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px; border-radius: 10px; text-decoration: none;
    font-weight: 700; font-size: 15px; transition: transform .15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-en  { background: #469A3D; color: #fff; }
  .btn-pt  { background: #1a6b30; color: #fff; }
  .btn-es  { background: #0f4c1e; color: #fff; }
  .divider { width: 48px; height: 3px; background: #469A3D; border-radius: 2px; margin: 24px auto; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;900&display=swap">
</head>
<body>
  <img class="logo" src="/wp-content/uploads/2025/11/new-hope-logo.webp" alt="New Hope Immigration Services" onerror="this.style.display='none'">
  <h1>404</h1>
  <h2>Page not found · Página não encontrada · Página no encontrada</h2>
  <p>The page you are looking for doesn't exist or was moved. Choose your language below.</p>
  <div class="divider"></div>
  <div class="langs">
    <a href="/en/" class="btn btn-en">🇺🇸 English</a>
    <a href="/pt-br/" class="btn btn-pt">🇧🇷 Português</a>
    <a href="/es/" class="btn btn-es">🇪🇸 Español</a>
  </div>
  <br>
  <a href="/" class="btn" style="background:#0f172a;color:#fff;margin-top:8px;">← Language Selector</a>
</body>
</html>
